<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Expenses')}"></head>
<body>
<header th:replace="~{fragments :: nav}"></header>
<main class="container">
    <div th:replace="~{fragments :: flash}"></div>
    <div class="page-head"><h1>Expenses</h1></div>

    <div class="card">
        <h3>Add expense</h3>
        <form class="form-inline" th:action="@{/expenses}" method="post">
            <label>Date <input type="date" name="date" th:value="${today}" required></label>
            <label>Type
                <select name="category">
                    <option th:each="c : ${categories}" th:value="${c}" th:text="${c}"></option>
                </select>
            </label>
            <label>Amount (₹) <input type="number" step="0.01" min="0.01" name="amount" required></label>
            <label>Paid by <select th:replace="~{fragments :: modes}"></select></label>
            <label style="flex:2 1 200px">Note <input name="note" maxlength="200" placeholder="e.g. November rent"></label>
            <button class="btn primary">Save</button>
        </form>
    </div>

    <form class="card filters" th:action="@{/expenses}" method="get">
        <label>From <input type="date" name="from" th:value="${from}"></label>
        <label>To <input type="date" name="to" th:value="${to}"></label>
        <button class="btn">Show</button>
    </form>

    <div class="stats">
        <div class="stat hero"><span class="muted">Total expenses</span><strong th:text="'₹ ' + ${@money.inr(total)}"></strong></div>
        <div class="stat" th:each="e : ${byCategory}"><span class="muted" th:text="${e.key}"></span>
            <strong th:text="'₹ ' + ${@money.inr(e.value)}"></strong></div>
    </div>

    <div class="card">
        <table class="table">
            <thead><tr><th>Date</th><th>Type</th><th>Note</th><th>Paid by</th><th class="r">Amount</th><th></th></tr></thead>
            <tbody>
            <tr th:each="e : ${expenses}">
                <td th:text="${#temporals.format(e.expenseDate, 'dd/MM/yyyy')}"></td>
                <td th:text="${e.category}"></td>
                <td th:text="${e.note}"></td>
                <td th:text="${e.mode}"></td>
                <td class="r" th:text="${@money.inr(e.amount)}"></td>
                <td class="r"><form class="inline" th:action="@{/expenses/{id}/delete(id=${e.id})}" method="post"
                                    onsubmit="return confirm('Delete this expense?')"><button class="btn sm danger">Delete</button></form></td>
            </tr>
            <tr th:if="${#lists.isEmpty(expenses)}"><td colspan="6" class="muted">No expenses in this period.</td></tr>
            </tbody>
        </table>
    </div>
</main>
</body>
</html>
