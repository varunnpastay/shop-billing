<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#04163d">
    <title th:text="'Login | ' + ${shop.shopName}">Login</title>
    <link rel="icon" type="image/svg+xml" th:href="@{/img/logo.svg}">
    <link rel="stylesheet" th:href="@{/css/peacock-login.css}">
    <!-- start downloading the peacock layers straight away, so the flight can begin sooner -->
    <link rel="preload" as="image" th:href="@{/img/peacock/logo-plate.webp}">
    <link rel="preload" as="image" th:href="@{/img/peacock/body.webp}">
    <link rel="preload" as="image" th:href="@{/img/peacock/wing.webp}">
    <link rel="preload" as="image" th:href="@{/img/peacock/saree.webp}">
</head>
<body th:data-rig="@{/img/peacock/rig.json}" th:data-body="@{/img/peacock/body.webp}"
      th:data-wing="@{/img/peacock/wing.webp}" th:data-saree="@{/img/peacock/saree.webp}">
<div class="login-page" id="loginPage">
    <!-- navy background with gold mandalas, twinkling stars and sparkles (mandalas and stars are drawn by peacock-login.js) -->
    <div class="bg" aria-hidden="true">
        <div class="bg-glow"></div>
        <svg class="mandala mandala-right" viewBox="-540 -540 1080 1080">
            <g fill="none" stroke="currentColor" stroke-width="2"><path class="mandala-petals"/><circle r="30"/><circle r="150"/><circle r="330"/><circle r="525"/></g>
        </svg>
        <svg class="mandala mandala-left" viewBox="-540 -540 1080 1080">
            <g fill="none" stroke="currentColor" stroke-width="2"><path class="mandala-petals"/><circle r="30"/><circle r="150"/><circle r="330"/><circle r="525"/></g>
        </svg>
        <div class="bg-streak"></div>
        <div class="bg-stars"></div>
        <svg class="sparkle" style="left:63.8%;top:9.3%;animation-delay:0s" viewBox="-10 -10 20 20"><path d="M0,-10 C1,-2 2,-1 10,0 C2,1 1,2 0,10 C-1,2 -2,1 -10,0 C-2,-1 -1,-2 0,-10Z" fill="#f3e2b8"/></svg>
        <svg class="sparkle" style="left:54.7%;top:59.4%;animation-delay:1.3s" viewBox="-10 -10 20 20"><path d="M0,-10 C1,-2 2,-1 10,0 C2,1 1,2 0,10 C-1,2 -2,1 -10,0 C-2,-1 -1,-2 0,-10Z" fill="#f3e2b8"/></svg>
        <svg class="sparkle" style="left:94.5%;top:15.5%;animation-delay:2.6s" viewBox="-10 -10 20 20"><path d="M0,-10 C1,-2 2,-1 10,0 C2,1 1,2 0,10 C-1,2 -2,1 -10,0 C-2,-1 -1,-2 0,-10Z" fill="#f3e2b8"/></svg>
        <svg class="sparkle" style="left:22.4%;top:81.5%;animation-delay:3.9s" viewBox="-10 -10 20 20"><path d="M0,-10 C1,-2 2,-1 10,0 C2,1 1,2 0,10 C-1,2 -2,1 -10,0 C-2,-1 -1,-2 0,-10Z" fill="#f3e2b8"/></svg>
    </div>

    <main class="login-layout">
        <!-- the logo with the peacock and saree lifted out; the WebGL canvas draws them back, animated -->
        <section class="brand-col">
            <div class="peacock-stage">
                <img class="logo-plate" id="logoPlate" th:src="@{/img/peacock/logo-plate.webp}"
                     th:data-original="@{/img/peacock/logo-original.webp}" width="1720" height="1300"
                     th:alt="${shop.shopName} + ' - Sarees &amp; Wholesale Cloth Merchant'" draggable="false">
                <div class="peacock-host" id="peacockHost"></div>
            </div>
        </section>

        <section class="form-col">
            <div class="login-card-wrap">
                <form class="login-card" id="loginForm" th:action="@{/login}" th:data-home="@{/}" method="post" novalidate>
                    <p class="eyebrow">Billing System</p>
                    <h1 class="title">Welcome back</h1>
                    <p class="subtitle" th:text="'Sign in to ' + ${shop.shopName}">Sign in</p>
                    <p class="notice" th:if="${msg}" th:text="${msg}"></p>

                    <label class="field">
                        <span>Username</span>
                        <input name="username" th:value="${username}" autocomplete="username" required autofocus>
                    </label>
                    <label class="field">
                        <span>Password</span>
                        <input name="password" type="password" autocomplete="current-password" required>
                    </label>

                    <p class="error" th:classappend="${error != null} ? 'is-visible'" role="alert" aria-live="assertive"
                       th:text="${error ?: ' '}"> </p>

                    <button type="submit" class="login-btn">Login</button>

                    <div class="tagline">
                        <span class="rule"></span>
                        Sarees &amp; Wholesale Cloth Merchant
                        <span class="rule"></span>
                    </div>
                </form>
            </div>
        </section>
    </main>
</div>

<script th:src="@{/js/vendor/gsap-3.12.5.min.js}"></script>
<script th:src="@{/js/peacock-engine.js}"></script>
<script th:src="@{/js/peacock-login.js}"></script>
</body>
</html>
