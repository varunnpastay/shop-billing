<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head(${supplier.name})}"></head>
<body>
<header th:replace="~{fragments :: nav}"></header>
<main class="container">
    <div th:replace="~{fragments :: flash}"></div>
    <div class="page-head">
        <div>
            <h1 th:text="${supplier.name}"></h1>
            <div class="small muted"><span th:text="${supplier.phone}"></span> <span th:if="${supplier.gstin}" th:text="' · GSTIN ' + ${supplier.gstin}"></span> <span th:if="${supplier.address}" th:text="' · ' + ${supplier.address}"></span></div>
        </div>
        <div class="btn-row">
            <a class="btn primary" th:href="@{/purchases/new(supplierId=${supplier.id})}">+ Purchase</a>
            <a class="btn" th:href="@{/suppliers/{id}/edit(id=${supplier.id})}">Edit</a>
            <form th:action="@{/suppliers/{id}/delete(id=${supplier.id})}" method="post" onsubmit="return confirm('Delete this supplier?')">
                <button class="btn ghost">Delete</button></form>
        </div>
    </div>

    <div class="stats">
        <div class="stat warn"><span class="muted">Balance to pay</span>
            <strong th:text="'₹ ' + ${@money.inr(balance)}"></strong>
            <span class="small muted" th:if="${balance.signum() < 0}">Paid in advance</span></div>
        <div class="stat"><span class="muted">Purchases</span><strong th:text="${#lists.size(purchases)}"></strong></div>
    </div>

    <div class="card">
        <h3>Record a payment to this supplier</h3>
        <form class="form-inline" th:action="@{/suppliers/{id}/pay(id=${supplier.id})}" method="post">
            <label>Date <input type="date" name="date" th:value="${today}" required></label>
            <label>Amount (₹) <input type="number" step="0.01" min="0.01" name="amount" required></label>
            <label>Paid by <select th:replace="~{fragments :: modes}"></select></label>
            <label style="flex:2 1 200px">Note <input name="note" maxlength="200" placeholder="Cheque no, UTR…"></label>
            <button class="btn primary">Save payment</button>
        </form>
    </div>

    <div class="split">
        <div class="card">
            <h3>Purchases</h3>
            <table class="table">
                <thead><tr><th>Date</th><th>Invoice</th><th class="r">Total</th><th></th></tr></thead>
                <tbody>
                <tr th:each="p : ${purchases}">
                    <td th:text="${#temporals.format(p.purchaseDate, 'dd/MM/yyyy')}"></td>
                    <td th:text="${p.invoiceNo}"></td>
                    <td class="r" th:text="${@money.inr(p.total)}"></td>
                    <td class="r"><a class="btn sm" th:href="@{/purchases/{id}(id=${p.id})}">Open</a></td>
                </tr>
                <tr th:if="${#lists.isEmpty(purchases)}"><td colspan="4" class="muted">No purchases yet.</td></tr>
                </tbody>
            </table>
        </div>
        <div class="card">
            <h3>Payments made</h3>
            <table class="table">
                <thead><tr><th>Date</th><th>Mode</th><th>Note</th><th class="r">Amount</th><th></th></tr></thead>
                <tbody>
                <tr th:each="p : ${payments}">
                    <td th:text="${#temporals.format(p.payDate, 'dd/MM/yyyy')}"></td>
                    <td th:text="${p.mode}"></td>
                    <td class="small" th:text="${p.note}"></td>
                    <td class="r" th:text="${@money.inr(p.amount)}"></td>
                    <td class="r"><form class="inline" th:action="@{/suppliers/{id}/payments/{pid}/delete(id=${supplier.id},pid=${p.id})}"
                                        method="post" onsubmit="return confirm('Delete this payment?')"><button class="btn sm danger">Delete</button></form></td>
                </tr>
                <tr th:if="${#lists.isEmpty(payments)}"><td colspan="5" class="muted">No payments yet.</td></tr>
                </tbody>
            </table>
        </div>
    </div>
    <p class="small muted" th:if="${supplier.notes}" th:text="'Notes: ' + ${supplier.notes}"></p>
</main>
</body>
</html>
