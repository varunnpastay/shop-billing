<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Item')}"></head>
<body>
<header th:replace="~{fragments :: nav}"></header>
<main class="container narrow">
    <div th:replace="~{fragments :: flash}"></div>
    <h1 th:text="${product.id == null} ? 'Add Item' : 'Edit Item'"></h1>
    <form class="card" th:action="@{/products/save}" th:object="${product}" method="post">
        <input type="hidden" th:field="*{id}">
        <label>Item / Service Name * <input th:field="*{name}" required></label>
        <label>HSN / SAC Code <input th:field="*{hsn}"></label>
        <label>Unit (Nos, Kg, Mtr, Set...) <input th:field="*{unit}"></label>
        <label>Default Rate (₹) <input type="number" step="0.01" min="0" th:field="*{rate}"></label>
        <label>MRP (₹) – shown on local bills <input type="number" step="0.01" min="0" th:field="*{mrp}"></label>
        <div class="btn-row">
            <button class="btn primary">Save</button>
            <a class="btn ghost" th:href="@{/products}">Cancel</a>
        </div>
    </form>
</main>
</body>
</html>
