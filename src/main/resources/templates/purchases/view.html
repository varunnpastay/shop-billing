<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Purchase')}"></head>
<body>
<header th:replace="~{fragments :: nav}"></header>
<main class="container">
    <div th:replace="~{fragments :: flash}"></div>
    <div class="page-head">
        <h1>Purchase <span th:if="${purchase.invoiceNo}" th:text="'– Invoice ' + ${purchase.invoiceNo}"></span></h1>
        <div class="btn-row">
            <a class="btn" th:href="@{/purchases/{id}/edit(id=${purchase.id})}">Edit</a>
            <button class="btn" onclick="window.print()">Print / PDF</button>
            <form th:action="@{/purchases/{id}/delete(id=${purchase.id})}" method="post"
                  onsubmit="return confirm('Delete this purchase? Its quantities will be taken out of stock again.')">
                <button class="btn danger">Delete</button></form>
        </div>
    </div>
    <div class="card grid-4">
        <div class="span-2"><span class="muted">Supplier</span><br>
            <a th:href="@{/suppliers/{id}(id=${purchase.supplierId})}"><b th:text="${purchase.supplierName}"></b></a></div>
        <div><span class="muted">Date</span><br><b th:text="${#temporals.format(purchase.purchaseDate, 'dd/MM/yyyy')}"></b></div>
        <div><span class="muted">Total</span><br><b th:text="'₹ ' + ${@money.inr(purchase.total)}"></b></div>
    </div>
    <div class="card">
        <table class="table">
            <thead><tr><th>#</th><th>Item</th><th class="r">Qty</th><th class="r">Rate</th><th class="r">Amount</th></tr></thead>
            <tbody>
            <tr th:each="i, st : ${purchase.items}">
                <td th:text="${st.count}"></td>
                <td th:text="${i.productName}"></td>
                <td class="r" th:text="${@money.qty(i.qty)}"></td>
                <td class="r" th:text="${@money.inr(i.rate)}"></td>
                <td class="r" th:text="${@money.inr(i.amount)}"></td>
            </tr>
            </tbody>
            <tfoot>
            <tr th:if="${purchase.otherCharges != null and purchase.otherCharges.signum() != 0}">
                <td colspan="4" class="r">Other charges</td><td class="r" th:text="${@money.inr(purchase.otherCharges)}"></td></tr>
            <tr><th colspan="4" class="r">Total</th><th class="r" th:text="'₹ ' + ${@money.inr(purchase.total)}"></th></tr>
            </tfoot>
        </table>
        <p class="small muted" th:if="${purchase.notes}" th:text="'Notes: ' + ${purchase.notes}"></p>
    </div>
</main>
</body>
</html>
