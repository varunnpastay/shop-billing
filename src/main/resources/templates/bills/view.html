<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head(${'Bill ' + bill.billNo})}"></head>
<body>
<header th:replace="~{fragments :: nav}"></header>
<main class="container">
    <div th:replace="~{fragments :: flash}"></div>
    <div class="page-head">
        <h1>Bill #<span th:text="${bill.billNo}"></span>
            <span th:replace="~{fragments :: status(${bill})}"></span></h1>
        <div class="btn-row">
            <a class="btn primary" th:href="@{/bills/{id}/print(id=${bill.id})}" target="_blank">Print A4</a>
            <a class="btn" th:href="@{/bills/{id}/print(id=${bill.id},size='A5')}" target="_blank">Print A5</a>
            <a class="btn" th:href="@{/bills/{id}/print(id=${bill.id},copy='DUPLICATE')}" target="_blank">Duplicate Copy</a>
            <a class="btn" th:if="${!bill.cancelled}" th:href="@{/bills/{id}/edit(id=${bill.id})}">Edit</a>
            <a class="btn" th:href="@{/bills/{id}/copy(id=${bill.id})}">Copy to New Bill</a>
        </div>
    </div>

    <div class="card grid-4">
        <div><span class="muted">Date</span><br><b th:text="${#temporals.format(bill.billDate, 'dd/MM/yyyy')}"></b></div>
        <div class="span-2"><span class="muted">Customer</span><br><b th:text="${bill.customerName}"></b>
            <div class="small" th:text="${bill.customerAddress}"></div>
            <div class="small" th:if="${bill.customerGstin}" th:text="'GSTIN: ' + ${bill.customerGstin}"></div></div>
        <div><span class="muted">Type</span><br><b th:text="${bill.billType}"></b><div class="small" th:if="${bill.byName}" th:text="'By: ' + ${bill.byName}"></div></div>
    </div>

    <div class="card">
        <table class="table">
            <thead><tr><th>#</th><th>Particulars</th><th>HSN</th><th class="r">Piece / Metter</th><th class="r">Rate</th><th class="r">Amount</th></tr></thead>
            <tbody>
            <tr th:each="i, st : ${bill.items}">
                <td th:text="${st.count}"></td>
                <td><span th:text="${i.particulars}"></span><div class="small muted" th:if="${i.details}" th:text="${i.details}"></div></td>
                <td th:text="${i.hsn}"></td>
                <td class="r" th:text="${#numbers.formatDecimal(i.qty, 1, 'COMMA', 2, 'POINT')} + ' ' + ${i.unit ?: ''}"></td>
                <td class="r" th:text="${#numbers.formatDecimal(i.rate, 1, 'COMMA', 2, 'POINT')}"></td>
                <td class="r" th:text="${#numbers.formatDecimal(i.amount, 1, 'COMMA', 2, 'POINT')}"></td>
            </tr>
            </tbody>
            <tfoot>
            <tr><td colspan="5" class="r">Taxable Amount</td><td class="r" th:text="${#numbers.formatDecimal(bill.taxableAmount, 1, 'COMMA', 2, 'POINT')}"></td></tr>
            <tr th:if="${bill.taxType == 'CGST_SGST'}"><td colspan="5" class="r">CGST + SGST</td>
                <td class="r" th:text="${#numbers.formatDecimal(bill.cgst.add(bill.sgst), 1, 'COMMA', 2, 'POINT')}"></td></tr>
            <tr th:if="${bill.taxType == 'IGST'}"><td colspan="5" class="r">IGST</td>
                <td class="r" th:text="${#numbers.formatDecimal(bill.igst, 1, 'COMMA', 2, 'POINT')}"></td></tr>
            <tr><th colspan="5" class="r">Grand Total</th><th class="r" th:text="'₹ ' + ${#numbers.formatDecimal(bill.grandTotal, 1, 'COMMA', 2, 'POINT')}"></th></tr>
            </tfoot>
        </table>
        <p class="small muted" th:if="${bill.notes}" th:text="'Notes: ' + ${bill.notes}"></p>
    </div>

    <div class="btn-row">
        <form th:if="${!bill.cancelled}" th:action="@{/bills/{id}/paid(id=${bill.id})}" method="post">
            <input type="hidden" name="value" th:value="${!bill.paid}">
            <button class="btn" th:text="${bill.paid} ? 'Mark as Unpaid' : 'Mark as Paid'"></button>
        </form>
        <form th:action="@{/bills/{id}/cancel(id=${bill.id})}" method="post"
              onsubmit="return confirm('Are you sure?')">
            <input type="hidden" name="value" th:value="${!bill.cancelled}">
            <button class="btn danger" th:text="${bill.cancelled} ? 'Restore Bill' : 'Cancel Bill'"></button>
        </form>
    </div>
</main>
</body>
</html>
