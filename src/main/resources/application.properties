spring.application.name=shop-billing
server.port=${PORT:8080}

# Optional local settings (PORT, EXPORT_CRON) in ./db.properties, see db.properties.example
spring.config.import=optional:file:./db.properties

# ---------- Database ----------
# The built-in database, saved in the ./data folder next to the app. Nothing to install.
spring.datasource.url=jdbc:h2:file:./data/billingdb;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=

# ---------- Backups (one a day into ./backups; checked every 6 hours) ----------
backup.dir=${BACKUP_DIR:./backups}
backup.keep=30

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=true

spring.thymeleaf.cache=true

# ---------- Session & cookies ----------
server.servlet.session.timeout=8h
server.servlet.session.tracking-modes=cookie
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

# ---------- Uploads (shop logo, limit enforced in code at 1 MB) ----------
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=3MB

# ---------- Errors: friendly page, no stack traces to the browser ----------
server.error.include-stacktrace=never
server.error.include-message=never
server.error.whitelabel.enabled=false

# ---------- Static files: content-hashed URLs so browsers always load the latest CSS / JS after an update ----------
spring.web.resources.chain.strategy.content.enabled=true
spring.web.resources.chain.strategy.content.paths=/**
spring.web.resources.cache.cachecontrol.max-age=30d

# daily off-computer backup (Excel + database), pushed to a private GitHub repository (link set in Settings)
export.dir=${EXPORT_DIR:./data-export}
export.cron=${EXPORT_CRON:0 0 13,20 * * *}
