spring.application.name=shop-billing
server.port=${PORT:8080}

# ---------- Database ----------
# Default: the built-in database, saved in the ./data folder next to the app. Nothing to install, backed up
# automatically every day to ./backups.
# To use PostgreSQL (or MySQL) instead, put DB_URL / DB_USERNAME / DB_PASSWORD in ./db.properties (in the folder you
# start the app from; see db.properties.example) or set them as environment variables. The driver is picked from the URL.
spring.config.import=optional:file:./db.properties
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/billingdb;AUTO_SERVER=TRUE}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}

# ---------- Backups (built-in database only) ----------
backup.dir=${BACKUP_DIR:./backups}
backup.keep=30

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=true

spring.thymeleaf.cache=true

# ---------- Session & cookies ----------
server.servlet.session.timeout=8h
server.servlet.session.tracking-modes=cookie
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

# ---------- Uploads (shop logo, limit enforced in code at 1 MB) ----------
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=3MB

# ---------- Errors: friendly page, no stack traces to the browser ----------
server.error.include-stacktrace=never
server.error.include-message=never
server.error.whitelabel.enabled=false
